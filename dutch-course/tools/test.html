  <script>
    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push('window.onerror: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
    window.addEventListener('unhandledrejection', (e) => window.__errors.push('unhandledrejection: ' + (e.reason && e.reason.message || e.reason)));
    const _ce = console.error; console.error = function () { window.__errors.push('console.error: ' + Array.from(arguments).map(String).join(' ')); _ce.apply(console, arguments); };
    try { localStorage.clear(); } catch (e) {}
    location.hash = '#/home';
  </script>
